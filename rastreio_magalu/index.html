<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreio Magalu - Acompanhe suas entregas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>📦 Rastreio Magalu</h1>
        <p>Acompanhe suas entregas da Magalog</p>
      </div>
      
      <form id="rastreioForm">
        <div class="input-group">
          <label for="codigo">Código de rastreamento</label>
          <input 
            type="text" 
            id="codigo" 
            placeholder="Digite o código (ex: MK123456789BR)"
            required
          >
        </div>
        
        <button type="submit" class="btn-primary">
          🔍 Rastrear Pedido
        </button>
      </form>
      
      <div class="info">
        <p>Exemplo de código: <code>MK123456789BR</code></p>
        <p class="small">O código é fornecido no e-mail de confirmação do pedido</p>
      </div>
    </div>
    
    <footer>
      <p>Desenvolvido para facilitar o rastreamento • Não oficial</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
